name: DO CSP Daily Screener

on:
  schedule:
    - cron: '0 12 * * 1-5'  # 8 AM ET weekdays
  workflow_dispatch:

jobs:
  screener:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run CSP Screener
        env:
          DISCORD_WEBHOOK_CSP: ${{ secrets.DISCORD_WEBHOOK_CSP }}
        run: |
          python scripts/csp_screener.py
      
      - name: Log execution
        if: always()
        run: echo "CSP Screener executed at $(date)"
